services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=trip_planner
      - POSTGRES_USER=trip_planner
      - POSTGRES_PASSWORD=trip_planner
    volumes:
      - n8n_trip_planner_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trip_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5679:5678"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_trip_planner_data:/home/node/.n8n
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_trip_planner_pgdata:
  n8n_trip_planner_data: